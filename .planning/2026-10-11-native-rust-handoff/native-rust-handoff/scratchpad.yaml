- id: trajectory-preflight-skill
  question: 日後需求徵詢技宜含廉價譜系預檢：active plan、git worktrees/ancestry、manifest/配方同源，辨歷史失敗與今目標；具體壓測尚未設，未造技。
- id: bootstrap-selection
  question: Which full Python test IDs does the Rust live-test command select, and what proves those tests
    ran and passed? Inspect source through mcpls or a source-backed subagent report before changing assertions.
    Count alone does not establish identity.
- id: installer-ux
  question: Does the user still require scripts/install.xsh? Replacing it with upstream native installers
    plus Arch packaging was proposed, not approved.
- id: dotenv-behavior
  question: Which .env loading behavior must survive the Rust transition? The old TypeScript dependency
    alone does not establish a requirement.
- id: windows-verification
  question: What runtime checks are needed for Windows? Native source exists; runtime parity has not been
    demonstrated.
- id: gemini-wording
  question: Has Gemini finished editing the old checkpoint next.immediate? Account for that edit before
    removing context-checkpoint.json; the schema represents the action as next[0].action.
decision:
  owner: 根負讀圖與執行；用戶定本案容險
  question: 既定 Rust 後端：如何保全 dirty 工作，續 upstream v0.10.0 移植而實證 Arch 包與 CLI？
  options:
  - 既有 feat/native-rust-xonsh 僅作唯讀參照與基線；勿在其 dirty 原件上補 Phase4／Phase5
  - 完成 Phase 0 等能盤點與基線後，於 v0.10.0 新隔離樹重驗 native commits 與必要 dirty 變更，再驗 release 與 Arch 包
  required:
  - 用戶已定 Rust 後端並准本案必要修碼與 Phase 5 原生包裝，毋重請源系或既准範圍；先作可逆 Phase 0 等能盤點與基線；大修前釐清尚未明之風險胃納，破壞、安裝或擴界另求准
  - 記 native commit 與 dirty 輸入，保全既物
  - 以實測 build/check/package、CLI 證成
constraints:
  writes: The root owns this YAML. Workers write only assigned code or evidence. Work in separate copies.
    Planning-only commits are allowed. No source commit, source merge, protected-file overwrite, or system
    installation in the current scope.
  builds: Scoped source repairs, tests and native packaging are approved. Do not rerun the unchanged full
    TUI suite. Packaging follows feature decisions and tested integration; no native release or Arch package
    has been verified.
  preservation:
  - 主樹 pkgbuild/PKGBUILD 既改、.SRCINFO 與舊 0.9.8 成品
  - native worktree 五 TUI 改檔與 skills/zsh/ 未追蹤
  - 舊 TypeScript 證據依 sources 所列原址查核；此處不複製
  - Use one persistent Python daemon with mode=xonsh, not a second daemon. Preserve the sidecar factory
    state machine and kernel session lease lifecycle.
  - Keep saved test evidence and unique facts when removing duplicate planning files. Do not expand the
    schema without a separate decision.
next:
- when: Before changing the bootstrap live test.
  action: Inspect the bootstrap live test selection through mcpls or a source-backed subagent report before
    proposing changes. Record the selector, selected full test IDs, runner behavior, and available results.
    A count alone cannot prove test identity. Choose any assertion change from that evidence, then rerun
    the focused test.
  accept: Record the command, selector, selected full test IDs, and how the result reaches the Rust assertion.
    Any proposed change follows those findings, not a test-count assumption.
- when: Before combining the source changes.
  action: Settle required fork features, installer behavior, dotenv behavior and Windows checks. Review
    the zsh skill and single-kernel wiring. Combine reviewed changes in a separate worktree.
  accept: Required features have tests or explicit decisions. Protected inputs are unchanged. The tool-to-kernel-to-sidecar
    path and TUI changes have test evidence.
- when: Before claiming the integration passes.
  action: Explain the saved catalog failures and classify core failures against upstream. Fix formatting
    and run the checks justified by the findings.
  accept: Failures are fixed or explicitly documented with supporting evidence. Do not repeat the unchanged
    full TUI suite.
- when: Feature scope and integration are verified.
  action: Update the Arch recipe for the native Rust binary, Python runtime and skills. Provide trusted
    offline catalogs. Run formatting, clippy, workspace tests, sidecar tests, release build and package
    checks; then verify package contents, dependencies, version output and CLI startup.
  accept: Save commands, exit codes, logs, source revision, protected input hashes and package path. No
    system installation.
