[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "ipykernel",
  "mcp>=2,<3",
  "nest-asyncio",
  "tyro",
]

[dependency-groups]
test = [
  "httpx",
  "mcp>=1.0",
]
dev = [
  "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
