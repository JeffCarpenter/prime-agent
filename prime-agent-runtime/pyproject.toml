[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28.1",
  "ipykernel",
  "mcp>=2.0.0",
  "nest-asyncio",
  "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
